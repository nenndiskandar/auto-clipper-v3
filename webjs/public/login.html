<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Clipper</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { base:'#09090b', surface:'#18181b', border:'#27272a', muted:'#a1a1aa', text:'#f4f4f5', accent:'#14b8a6', error:'#f43f5e', warn:'#f59e0b' } } } }
</script>
<style>
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid #14b8a6 !important;
  outline-offset: 2px !important;
}
#btn-login.btn-grad{ background: linear-gradient(90deg, #14b8a6 0%, #0ea5e9 30%, #6366f1 50%, #0ea5e9 70%, #14b8a6 100%); background-size: 300% 100%; animation: login-grad 1.2s linear infinite; color: #fff; border: 0; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
@keyframes login-grad{ 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
@media (prefers-reduced-motion: reduce){ #btn-login.btn-grad{ animation: none; } }
#btn-login.btn-grad:hover{ filter: brightness(1.06); }
#btn-login.btn-grad:active{ filter: brightness(0.94); }
#btn-login.btn-grad:disabled{ opacity: .7; animation: none; }



</style>
<link rel="stylesheet" href="/app.css?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script>
// FORCE CACHE CLEAR AND SW UNREGISTER
(async function() {
  if (localStorage.getItem('force_cleared_v13')) return;
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (let r of regs) await r.unregister();
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      for (let k of keys) await caches.delete(k);
    }
    localStorage.setItem('force_cleared_v13', '1');
    window.location.reload(true);
  } catch (e) {}
})();
</script>

</head>
<body class="min-h-screen bg-base text-text font-sans antialiased flex items-center justify-center p-2">
<div class="portal-bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="relative z-10 border border-border bg-surface/40 backdrop-blur rounded-xl shadow-xl p-3 max-w-sm w-full text-center space-y-1">
  <div>
    <h1 class="text-lg font-bold text-text tracking-wide"><i class="bi bi-film text-fuchsia-400"></i> Iskan Clip</h1>
    <p class="text-[11px] text-muted uppercase tracking-wider mt-1">Panel admin : akses terbatas</p>
  </div>
      <form id="login" class="space-y-1">
    <div class="relative w-full">
      <input id="pass" type="password" autocomplete="current-password" placeholder="Password"
        class="w-full bg-base border border-border rounded-xl px-2 py-1.5 pr-10 text-sm text-text placeholder:text-muted/60 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent">
      <button type="button" id="togglePassBtn" class="absolute inset-y-0 right-3 flex items-center justify-center text-muted hover:text-text focus:outline-none" aria-label="Tampilkan password">
         <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
           <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
           <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
         </svg>
         <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash hidden" viewBox="0 0 16 16">
           <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
           <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299l.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
           <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884l-12-12 .708-.708 12 12-.708.708z"/>
         </svg>
      </button>
    </div>
    <button id="btn-login" type="submit"
      class="btn-grad w-full font-semibold rounded-xl py-1.5 text-sm flex items-center justify-center gap-2 transition">
      <span id="btn-label">Masuk</span>
      <svg id="btn-spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
    </button>
  </form>

  <div class="space-y-1">
    <p class="text-[11px] text-[var(--text-secondary)]">Masukkan password admin.</p>
    <p id="err" class="text-xs text-red-400 hidden mt-1"></p>
    <p id="attempts" class="text-[11px] text-yellow-400 hidden mt-1"></p>
  </div>
</div>

<script>
document.getElementById('togglePassBtn').addEventListener('click', function() {
  const p = document.getElementById('pass');
  const es = document.getElementById('eyeShow');
  const eh = document.getElementById('eyeHide');
  if (p.type === 'password') {
    p.type = 'text';
    es.classList.add('hidden');
    eh.classList.remove('hidden');
    this.setAttribute('aria-label', 'Sembunyikan password');
  } else {
    p.type = 'password';
    es.classList.remove('hidden');
    eh.classList.add('hidden');
    this.setAttribute('aria-label', 'Tampilkan password');
  }
});

document.getElementById('login').addEventListener('submit', e => {
  e.preventDefault();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('btn-login');
  const label = document.getElementById('btn-label');
  const spin = document.getElementById('btn-spinner');
  const errEl = document.getElementById('err');
  const att = document.getElementById('attempts');
  if(btn){ btn.disabled=true; if(label) label.textContent='Memproses...'; if(spin) spin.classList.remove('hidden'); }
  if(errEl) errEl.classList.add('hidden');
  if(att) att.classList.add('hidden');
  fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ password: pass }),
  }).then(r => r.json().then(d => ({ status: r.status, d }))).then(({ status, d }) => {
    if (d.ok) { location.href = '/'; return; }
    if(btn){ btn.disabled=false; if(label) label.textContent='Masuk'; if(spin) spin.classList.add('hidden'); }
    const el = document.getElementById('err');
    el.textContent = d.error || 'Login gagal';
    el.classList.remove('hidden');
    if (typeof d.remaining === 'number') {
      if (d.remaining > 0) {
        att.textContent = 'Sisa percobaan: ' + d.remaining;
        att.classList.remove('hidden');
      } else {
        att.textContent = d.resetInSec
          ? 'Terkunci. Coba lagi dalam ' + Math.ceil(d.resetInSec / 60) + ' menit.'
          : 'Terkunci. Coba lagi nanti.';
        att.classList.remove('hidden');
      }
    } else {
      att.classList.add('hidden');
    }
  }).catch(() => {
    if(btn){ btn.disabled=false; if(label) label.textContent='Masuk'; if(spin) spin.classList.add('hidden'); }
    const el = document.getElementById('err');
    el.textContent = 'Gagal terhubung ke server';
    el.classList.remove('hidden');
  });
});
</script>
<script src="/ui.js?v=13"></script>
</body>
</html>
